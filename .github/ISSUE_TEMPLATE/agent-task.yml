name: Agent development task
description: A scoped task for Codex, subject to maintainer approval.
title: '[agent] '
labels: [agent-task]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal and scope
      description: State the requested behavior, relevant pages/files, and what must remain unchanged. Never include credentials.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Describe observable behavior, responsive/accessibility expectations, and any additional checks.
    validations:
      required: true
  - type: checkboxes
    id: boundaries
    attributes:
      label: Task boundaries
      options:
        - label: This task contains no credentials and requests no merge or production deployment.
          required: true
  - type: markdown
    attributes:
      value: 'The label classifies this issue. A maintainer must post `/codex implement` to approve the current task. Editing the issue does not approve or rerun it.'
