name: Prepare SnippetJam checks
description: Install locked frontend packages and isolated browser QA tools; no credentials.
runs:
  using: composite
  steps:
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
      with:
        node-version: '24'
    - shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install --no-install-recommends -y acl php-cli ripgrep
        command -v php
        command -v rg
        npm ci --no-audit --no-fund
        npm install --prefix node_modules/.cache/coding-qa --no-audit --no-fund --package-lock=false --save-exact @axe-core/playwright@4.10.2 @wordpress/block-serialization-default-parser@5.35.0 playwright-core@1.64.1
        node node_modules/.cache/coding-qa/node_modules/playwright-core/cli.js install --with-deps chromium
        node -e "const fs=require('node:fs'); const {chromium}=require('./node_modules/.cache/coding-qa/node_modules/playwright-core'); fs.appendFileSync(process.env.GITHUB_ENV, 'CHROMIUM_BINARY='+chromium.executablePath()+'\n');"
